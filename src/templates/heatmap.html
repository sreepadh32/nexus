{% extends "base.html" %}

{% block head %}
  <title> Map </title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@6.15.0/ol.css" />
  <style> .slider-container {
    text-align: center;
    background-color: #ffffff;
    padding: 15px 20px;
    border-radius: 10px;
    box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.1);
    margin: 0 20px;
  }

  #date-slider {
  width: 100%;
  background-color: transparent;
  outline: none;
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
{% endblock %}
{% block mainsection %}
        <h1 style="position: absolute; z-index: 10; margin: 80px 0 0 55px;">{{map}} Map</h1>
        <section class="content">
          <!-- OpenLayers Map -->
          <div id="map" style="width:100%; height:900px; z-index: 0; margin-top: 0px;"></div>
        {% if map!= "Predicted Air Quality Index" %}
        <div class="slider-container glass " style="position: absolute; z-index: 10;bottom: 10px;">
            <input id="date-slider" type="range" min="0" max="5" step="1" value="5">
            <div id="selected-date">Selected Date: <span id="date-label"></span></div>
        </div>
        {% else %}

        <div class="slider-container glass " style="position: absolute; z-index: 10;bottom: 10px;">
          <input id="date-slider" type="range" min="0" max="1" step="1" value="0">
          <div id="selected-date">Prediction for:  <span id="date-label"></span></div>
        </div>

        {% endif %}
        </section>
{% endblock %}

{% block script %}
  <script>
   // Initialize OpenLayers map
   const baseLayer = new ol.layer.Tile({
      source: new ol.source.OSM(),
    });

    // Dummy data points for heat map (latitude, longitude, and weight)
        const data_points = {{ data_points | tojson }};

    // Convert data points to OpenLayers features
    const features = data_points.map((point) => {
      const feature = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([point.lon, point.lat])),
      });
      feature.set('weight', point.weight);
      return feature;
    });

    // Heatmap source and layer
    const heatmapSource = new ol.source.Vector({
      features: features,
    });

    const heatmapLayer = new ol.layer.Heatmap({
      source: heatmapSource,
      blur: 20,   // Blurring effect radius
      radius: 20, // Radius of the heatmap points
      weight: (feature) => feature.get('weight'), // Use the weight property for intensity
    });

    // Create map with base layer and heatmap
    const map = new ol.Map({
      target: 'map',
      layers: [baseLayer, heatmapLayer],
      view: new ol.View({
        center: ol.proj.fromLonLat([75.231870, 12.240140]),
        zoom: 16, // Set the zoom level
      }),
    });

    setInterval(function() {
      location.reload();
    }, 60000); // 60000 milliseconds = 1 minute

    // Get slider elements (shared between both modes)
    const slider = document.getElementById('date-slider');
    const dateLabel = document.getElementById('date-label');

    // Add a function to update the heatmap data
    function updateHeatmapData(newDataPoints) {
        // Clear existing features
        heatmapSource.clear();
        
        // Create new features from the updated data points
        const newFeatures = newDataPoints.map((point) => {
            const feature = new ol.Feature({
                geometry: new ol.geom.Point(ol.proj.fromLonLat([point.lon, point.lat])),
            });
            feature.set('weight', point.weight);
            return feature;
        });
        
        // Add new features to the heatmap source
        heatmapSource.addFeatures(newFeatures);
    }

    {% if map!= "Predicted Air Quality Index" %}
    // -------------------------Historical Data Slider--------------------
    const today = new Date();
    const dates = [];

    for (let i = 5; i >= 1; i--) {
        const pastDate = new Date(today);
        pastDate.setDate(today.getDate() - i);
        dates.push(pastDate);
    }
    dates.push(new Date(today)); // Today 

    // Format date as YYYY-MM-DD
    function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${day}/${month}/${year}`;
    }

    // Update date label on slider input
    function updateDateLabel() {
        const selectedDate = dates[slider.value];
        dateLabel.textContent = formatDate(selectedDate);
    }

    // Initialize date label
    updateDateLabel();

    // Add event listener to update label on slider change
    slider.addEventListener('input', function() {
        updateDateLabel();
        const selectedDate = dates[slider.value];
        const formattedDate = formatDate(selectedDate);
        
        // Send the selected date to the backend using GET instead of POST
        fetch(`/map/heat/date?date=${formattedDate}`)
            .then(response => response.json())
            .then(data => {
                console.log('Success:', data);
                
                // Update the heatmap with new data
                updateHeatmapData(data.data_points);
            })
            .catch((error) => {
                console.error('Error:', error);
            });
    });
    {% else %}
    // -------------------------AQI Prediction Slider--------------------
    // Update prediction label on slider input
    function updatePredictionLabel() {
      if (slider.value == 0) {
    dateLabel.textContent = 'Tomorrow';
    fetch('/map/aqipredict?format=json')
        .then(response => response.json())
        .then(data => {
            console.log('Success:', data);
            if (data.data_points) {
                updateHeatmapData(data.data_points);
            }
        })
        .catch((error) => {
            console.error('Error:', error);
        });
} else {
    dateLabel.textContent = 'Next Week';
    fetch('/map/aqipredictweek?format=json')
        .then(response => response.json())
        .then(data => {
            console.log('Success:', data);
            if (data.data_points) {
                updateHeatmapData(data.data_points);
            }
        })
        .catch((error) => {
            console.error('Error:', error);
        });
}
    }

    // Initialize prediction label
    updatePredictionLabel();

    // Add event listener to update prediction on slider change
    slider.addEventListener('input', updatePredictionLabel);
    {% endif %}
  </script>
{% endblock %}
