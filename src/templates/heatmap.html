{% extends "base.html" %}

{% block head %}
  <title> Map </title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@6.15.0/ol.css" />
  <style> .slider-container {
    text-align: center;
    background-color: #ffffff;
    padding: 15px 20px;
    border-radius: 10px;
    box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.1);
    margin: 0 20px;
  }

  #date-slider {
  width: 100%;
  background-color: transparent;
  outline: none;
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
{% endblock %}
{% block mainsection %}
        <h1 style="position: absolute; z-index: 10; margin: 80px 0 0 55px;">{{map}} Map</h1>
        <section class="content">
          <!-- OpenLayers Map -->
          <div id="map" style="width:100%; height:900px; z-index: 0; margin-top: 0px;"></div>

        <div class="slider-container glass " style="position: absolute; z-index: 10;bottom: 10px;">
            <input id="date-slider" type="range" min="0" max="7" step="1" value="5">
            <div id="selected-date">Selected Date: <span id="date-label"></span></div>
        </div>
        </section>
{% endblock %}

{% block script %}
  <script>
 // Initialize OpenLayers map
const baseLayer = new ol.layer.Tile({
  source: new ol.source.OSM(),
});

// Fetch the data from Flask and parse it
const data_points = {{ data_points | tojson }};

// Function to determine color based on AQI value
function getAQIColor(aqi) {
    if (aqi <= 50) {
        return 'rgba(0, 255, 0, 0.5)'; // Green - Good
    } else if (aqi <= 100) {
        return 'rgba(255, 255, 0, 0.5)'; // Yellow - Moderate
    } else {
        return 'rgba(255, 0, 0, 0.5)'; // Red - Bad
    }
}

// Convert data points to OpenLayers features with AQI-based color styling
const features = data_points.map((point) => {
    const feature = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([point.lon, point.lat])),
    });

    // Assign AQI-based color
    const aqiColor = getAQIColor(point.aqi);

    feature.setStyle(new ol.style.Style({
        image: new ol.style.Circle({
            radius: 15,
            fill: new ol.style.Fill({ color: aqiColor }),
            stroke: new ol.style.Stroke({ color: 'black', width: 1 }),
        }),
    }));

    return feature;
});

// Heatmap source and layer with AQI-based features
const vectorSource = new ol.source.Vector({
    features: features,
});

const vectorLayer = new ol.layer.Vector({
    source: vectorSource,
});

// Heatmap Layer
const heatmapSource = new ol.source.Vector({
    features: data_points.map((point) => {
        const feature = new ol.Feature({
            geometry: new ol.geom.Point(ol.proj.fromLonLat([point.lon, point.lat])),
        });

        feature.set('weight', point.weight);

        return feature;
    }),
});

const heatmapLayer = new ol.layer.Heatmap({
    source: heatmapSource,
    blur: 30,       // Increased blur for a smoother heatmap
    radius: 40,     // Increased radius to expand data point influence
    weight: (feature) => feature.get('weight'), // Set weight dynamically
});

// Create map with base layer, vector layer (AQI points), and heatmap layer
const map = new ol.Map({
    target: 'map',
    layers: [baseLayer, heatmapLayer, vectorLayer],  // Both heatmap and AQI points
    view: new ol.View({
        center: ol.proj.fromLonLat([75.231870, 12.240140]),
        zoom: 16,
    }),
});

// Log to check if the AQI-based map is initialized correctly
console.log("AQI-based heatmap initialized with:", data_points);

// Refresh page every 60 seconds to update AQI values
setInterval(function() {
    location.reload();
}, 60000);



    // -------------------------Slider--------------------
    const slider = document.getElementById('date-slider');
    const dateLabel = document.getElementById('date-label');

    // Generate date options: past 5 days and 2 days in the future
    const today = new Date();
    const dates = [];

    for (let i = 5; i >= 1; i--) {
        const pastDate = new Date(today);
        pastDate.setDate(today.getDate() - i);
        dates.push(pastDate);
    }
    dates.push(new Date(today)); // Today

    for (let i = 1; i <= 2; i++) {
        const futureDate = new Date(today);
        futureDate.setDate(today.getDate() + i);
        dates.push(futureDate); // 1 and 2 days in the future
    }

    // Format date as YYYY-MM-DD
    function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${day}/${month}/${year}`;
    }

    // Update date label on slider input
    function updateDateLabel() {
        const selectedDate = dates[slider.value];
        dateLabel.textContent = formatDate(selectedDate);
    }

    // Initialize date label
    updateDateLabel();

    // Add event listener to update label on slider change
    slider.addEventListener('input', function() {
        updateDateLabel();
        const selectedDate = dates[slider.value];
        const formattedDate = formatDate(selectedDate);

        // Send the selected date to the backend
        fetch('/map/heat/date', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ date: formattedDate })
        })
        .then(response => response.json())
        .then(data => {
            console.log('Success:', data);
        })
        .catch((error) => {
            console.error('Error:', error);
        });
    });
  </script>
{% endblock %}
