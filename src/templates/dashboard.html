{% extends "base.html" %}

{% block head %}
<title>Dashboard</title>
<style>
  .chart-selector {
  display: flex;
  justify-content: center;
  margin: 10px 0;
}

.chart-selector label {
  margin: 0 10px;
  cursor: pointer;
}

.chart-selector input[type="radio"] {
  margin-right: 5px;
}
</style>
{% endblock %}

{% block mainsection %}
<section class="hero-section" style="margin-top: 100px; padding: 20px;">
  <div class="hero-text">
    <h1>For a Smarter, Cleaner Future.</h1>
  </div>
  <div class="hero-icons">
    <a href="/map/noise">
      <i class="fas fa-volume-up"></i>
    </a>
    <a href="/map/heat">
      <i class="fas fa-temperature-half"></i>
    </a>
    <a href="/map/air">
      <i class="fas fa-wind"></i>
    </a>
  </div>
</section>
<section class="charts">
  <div class="chart trend glass">
    <h3>Trend in Past Week</h3>
    <div class="chart-selector">
      <label><input type="radio" name="trend-param" value="temp" checked> Temperature</label>
      <label><input type="radio" name="trend-param" value="hum"> Humidity</label>
      <label><input type="radio" name="trend-param" value="gas"> Gas</label>
      <label><input type="radio" name="trend-param" value="noise"> Noise</label>
    </div>
    <canvas id="trendChart"></canvas>
  </div>
  <div class="chart limit glass ">
    <h3>Standard Limit v/s Current Pollution</h3>
    <canvas id="pollutionChart"></canvas>
  </div>
</section>
<section class="prediction">
  <h3>Prediction for Tomorrow (This may not be 100% accurate)</h3>
  <div class="prediction-icons">
    <i class="fas fa-volume-up"></i>
    <i class="fas fa-wind"></i>
    <i class="fas fa-temperature-high"></i>
  </div>
</section>
{% endblock %}

{% block script %}
<script>
// Global variables for chart and data
let trendChart;
let trendData = {
    dates: [],
    temps: [],
    hums: [],
    gases: [],
    noises: []
};

// Function to update the chart based on selected parameter
function updateTrendChart(parameter) {
    let data, color, borderColor, label, yAxisMin, yAxisMax;
    
    switch(parameter) {
        case 'temp':
            data = trendData.temps;
            color = 'rgba(193, 66, 66, 0.2)';
            borderColor = 'rgba(193, 66, 66, 0.9)';
            label = 'Temperature';
            yAxisMin = 0;
            yAxisMax = 60;
            break;
        case 'hum':
            data = trendData.hums;
            color = 'rgba(57, 126, 200, 0.2)';
            borderColor = 'rgb(66, 181, 199)';
            label = 'Humidity';
            yAxisMin = 0;
            yAxisMax = 100;
            break;
        case 'gas':
            data = trendData.gases;
            color = 'rgba(75, 192, 75, 0.2)';
            borderColor = 'rgba(75, 192, 75, 0.9)';
            label = 'Gas';
            yAxisMin = 100;
            yAxisMax = 2000;
            break;
        case 'noise':
            data = trendData.noises;
            color = 'rgba(255, 159, 64, 0.2)';
            borderColor = 'rgba(255, 159, 64, 0.9)';
            label = 'Noise';
            yAxisMin = 0;
            yAxisMax = 120;
            break;
    }
    
    // Update chart data
    trendChart.data.datasets = [{
        label: label,
        data: data,
        backgroundColor: color,
        borderColor: borderColor,
        borderWidth: 2
    }];
    
    // Update y-axis scale based on the selected parameter
    trendChart.options.scales.y.min = yAxisMin;
    trendChart.options.scales.y.max = yAxisMax;
    
    trendChart.update();
}

// Fetch data and initialize charts when DOM is loaded
document.addEventListener('DOMContentLoaded', () => {
    const ctx1 = document.getElementById('trendChart').getContext('2d');
    const ctx2 = document.getElementById('pollutionChart').getContext('2d');
    
    // Fetch trend data
    fetch('/get_trend_data')
        .then(response => response.json())
        .then(data => {
            // Store data globally
            trendData = data;
            
            // Initialize trend chart
            trendChart = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: data.dates,
                    datasets: [{
                        label: 'Temperature',
                        data: data.temps,
                        backgroundColor: 'rgba(193, 66, 66, 0.2)',
                        borderColor: 'rgba(193, 66, 66, 0.9)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            ticks: {
                                color: '#000000'
                            }
                        },
                        y: {
                            min: 0,
                            max: 60, // Default for temperature
                            ticks: {
                                color: '#000000'
                            }
                        }
                    }
                }
            });
        })
        .catch(error => console.error('Error fetching trend data:', error));
    
    // Initialize pollution chart (unchanged)
    new Chart(ctx2, {
        type: 'line',
        data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
            datasets: [{
                label: 'Pollution',
                data: [500, 600, 700, 650, 600, 580, 590, 600, 610, 620, 630, 640],
                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                borderColor: 'rgba(255, 99, 132, 1)',
                borderWidth: 2
            }]
        },
        options: { 
            responsive: true 
        }
    });
    
    // Add event listeners for radio buttons
    const radioButtons = document.querySelectorAll('input[name="trend-param"]');
    radioButtons.forEach(radio => {
        radio.addEventListener('change', function() {
            updateTrendChart(this.value);
        });
    });
});
</script>
{% endblock %}
